- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      myai:
        displayName: myai
        api: openai-completions
        apiKeyEnv: EVOLUTION_LOCAL_API_KEY
        baseURL: http://127.0.0.1:26661/v1
        reasoning: max
        retryPolicy:
          mode: normal
          maxRetries: 30
          backoff:
            initialDelayMs: 2000
            maxDelayMs: 60000
        streamIdleTimeoutMs: 900000
        models:
          - id: dsv41f
            name: dsv41f
            contextWindow: 1048576
            input:
              - text
            reasoningEfforts:
              off: null
              max: max
            compat:
              supportsReasoningEffort: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: myai
    model: dsv41f
    reasoningEffort: max
